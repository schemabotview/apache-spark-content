name: build

# Compile-time gate: tsc type-checks the scenes + course together (beats reference scene
# node ids in the same TS project), and vite builds the app. Replaces the old CI that
# fetched the engine's scene-ids.json — validation is now local to this repo.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
